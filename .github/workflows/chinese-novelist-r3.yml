name: Chinese Novelist R3 routing tests

on:
  push:
    branches:
      - feat/r3-migration
    paths:
      - '**'
      - '.github/workflows/chinese-novelist-r3.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - '**'
      - '.github/workflows/chinese-novelist-r3.yml'

permissions:
  contents: read

jobs:
  r3-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify R3 opt-in, legacy routing, and fail-closed gate
        run: node --test tests/r3-routing.test.mjs
      - name: Verify strict R3 core and rolling section parser
        run: node --test scripts/tests/r3_plan_sections.test.mjs
      - name: Verify snapshot, diff, core consent and volume checkpoints
        run: node --test scripts/tests/r3_plan_protocol.test.mjs
      - name: Fault injection for R3 snapshot paths and approvals
        run: node --test scripts/tests/r3_faults.test.mjs

      - name: Verify portable R3 experience library
        run: node --test scripts/tests/r3_experience.test.mjs

      - name: Verify P1-08 Drive authority, commit pointers and portable history
        run: node --test scripts/tests/r3_experience_drive.test.mjs
